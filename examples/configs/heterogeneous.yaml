# A heterogeneous roundtable: Claude via the Anthropic SDK plus open / third-party
# models through any OpenAI-compatible endpoint (here OpenRouter; vLLM, SGLang,
# Ollama, DeepSeek, xAI ... work the same way via base_url).
#   export ANTHROPIC_API_KEY=...  OPENROUTER_API_KEY=...
players:
  - {backend: anthropic, model: claude-opus-5-5, name: claude-opus}
  - {backend: openai, model: openai/gpt-4o, name: gpt-4o,
     base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY}
  - {backend: openai, model: deepseek/deepseek-chat, name: deepseek-chat,
     base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY}
  - {backend: openai, model: qwen/qwen-plus, name: qwen-plus,
     base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY}
  - {backend: openai, model: meta-llama/llama-3.3-70b-instruct, name: llama-3.3-70b,
     base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY}
  # A local vLLM server would be:
  # - {backend: openai, model: Qwen/Qwen2.5-7B-Instruct, base_url: "http://localhost:8000/v1", api_key_env: VLLM_API_KEY}
graders:
  - {backend: anthropic, model: claude-opus-5-5, name: grader-claude, effort: low}
  - {backend: openai, model: openai/gpt-4o, name: grader-gpt-4o, temperature: 0,
     base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY}
fusion: {backend: anthropic, model: claude-opus-5-5, name: fusion-claude}
dimensions: [overall]
max_workers: 8
