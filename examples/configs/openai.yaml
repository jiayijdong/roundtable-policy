# All agents through the OpenAI API (export OPENAI_API_KEY=...).
# Any extra keys (temperature, max_tokens, ...) are forwarded to chat.completions.create.
players:
  - {backend: openai, model: gpt-4o}
  - {backend: openai, model: gpt-4o-mini}
  - {backend: openai, model: gpt-4.1}
  - {backend: openai, model: gpt-4.1-nano}
graders:
  - {backend: openai, model: gpt-4o, name: grader-gpt-4o, temperature: 0}
  - {backend: openai, model: gpt-4.1, name: grader-gpt-4.1, temperature: 0}
fusion: {backend: openai, model: gpt-4o, name: fusion-gpt-4o}
dimensions: [overall]
max_workers: 8
